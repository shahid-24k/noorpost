name: NoorPost Ultimate Production Agent

on:
  schedule:
    # 08:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
    # 09:00 PM IST (15:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: "Type of Islamic content to generate"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - hadith_sahih
          - daily_duas
          - quranic_verses
          - friday_reminders
          - short_reminders
          - repurpose
      theme:
        description: "Visual theme"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - midnight-gold
          - emerald-serenity
          - minimal-white
          - peaceful-nature
          - reflective-night
          - masjid-elegance
          - ramadan-eid
      preset:
        description: "Rendering preset"
        required: false
        default: "balanced"
        type: choice
        options:
          - fast
          - balanced
          - high_quality
      duration:
        description: "Video duration in seconds"
        required: false
        default: "15"
      enable_nasheed:
        description: "Attach authorized Halal Tunes nasheed highlight"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run mode (generate video preview without publishing to Dropbox)"
        required: false
        default: false
        type: boolean
      repurpose_url:
        description: "Authorized YouTube URL (required if content_type is repurpose)"
        required: false
        default: ""
      confirm_rights:
        description: "Confirm authorization to repurpose YouTube source"
        required: false
        default: false
        type: boolean

concurrency:
  group: noorpost-production
  cancel-in-progress: false

jobs:
  publish_reel:
    name: Generate & Publish Islamic Reel
    runs-on: ubuntu-latest

    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      SUNNAH_API_KEY: ${{ secrets.SUNNAH_API_KEY }}
      TIMEZONE: "Asia/Kolkata"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Essential Credentials
        if: ${{ !(github.event.inputs.dry_run == 'true') }}
        run: |
          if [ -z "$DROPBOX_REFRESH_TOKEN" ] && [ -z "$DROPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Missing required Dropbox secret. Set DROPBOX_REFRESH_TOKEN (along with DROPBOX_APP_KEY and DROPBOX_APP_SECRET) or DROPBOX_ACCESS_TOKEN in GitHub Repository Secrets."
            exit 1
          fi

      - name: Pull Persistent State from Dropbox
        run: |
          python main.py --sync-state-down

      - name: Execute Content Generation & Publishing
        env:
          INPUT_CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
          INPUT_PRESET: ${{ github.event.inputs.preset }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_ENABLE_NASHEED: ${{ github.event.inputs.enable_nasheed }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_REPURPOSE_URL: ${{ github.event.inputs.repurpose_url }}
          INPUT_CONFIRM_RIGHTS: ${{ github.event.inputs.confirm_rights }}
        run: |
          python scripts/run_workflow.py

      - name: Push Persistent State to Dropbox
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          python main.py --sync-state-up
