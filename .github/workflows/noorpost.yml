name: NoorPost Agent

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install "moviepy==1.0.3" Pillow requests arabic-reshaper python-bidi APScheduler dropbox imageio imageio-ffmpeg

      - name: Create config.py
        run: |
          echo "DROPBOX_APP_KEY = '${{ secrets.DROPBOX_APP_KEY }}'" > config.py
          echo "DROPBOX_APP_SECRET = '${{ secrets.DROPBOX_APP_SECRET }}'" >> config.py
          echo "DROPBOX_REFRESH_TOKEN = '${{ secrets.DROPBOX_REFRESH_TOKEN }}'" >> config.py
          echo "DROPBOX_ACCESS_TOKEN = ''" >> config.py
          echo "SKIP_YOUTUBE = True" >> config.py
          echo "YT_CREDENTIALS_FILE = 'credentials.json'" >> config.py
          echo "YT_TOKEN_FILE = 'yt_token.pkl'" >> config.py
          echo "POST_TIMES = [{'hour': 8, 'minute': 0}, {'hour': 21, 'minute': 0}]" >> config.py
          echo "TIMEZONE = 'Asia/Kolkata'" >> config.py
          echo "VIDEO_WIDTH = 1080" >> config.py
          echo "VIDEO_HEIGHT = 1920" >> config.py
          echo "VIDEO_DURATION = 15" >> config.py
          echo "VIDEO_FPS = 24" >> config.py
          echo "FONT_ARABIC = 'assets/fonts/Amiri-Regular.ttf'" >> config.py
          echo "FONT_BOLD = 'assets/fonts/Amiri-Bold.ttf'" >> config.py
          echo "FONT_LATIN = 'assets/fonts/NotoSans-VariableFont_wdth,wght.ttf'" >> config.py
          echo "COLOR_BG = (8, 11, 16)" >> config.py
          echo "COLOR_GOLD = (201, 168, 76)" >> config.py
          echo "COLOR_GOLD_DIM = (122, 97, 40)" >> config.py
          echo "COLOR_WHITE = (232, 228, 217)" >> config.py
          echo "COLOR_DIM = (122, 135, 153)" >> config.py
          echo "FONT_MODE = 'noto'" >> config.py
          echo "THEME_MODE = 'random'" >> config.py
          python -c "import config; print('KEY:', config.DROPBOX_APP_KEY[:5] if config.DROPBOX_APP_KEY else 'EMPTY')"

      - name: Create directories
        run: mkdir -p assets/audio output_videos logs

      - name: Run NoorPost Agent
        run: python main.py --now
